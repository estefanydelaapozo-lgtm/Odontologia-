services:
  postgres:
    image: postgres:16-alpine
    container_name: sigo-dental-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: sigo_dental
      POSTGRES_USER: sigo
      POSTGRES_PASSWORD: sigo_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigo -d sigo_dental"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - sigo_postgres:/var/lib/postgresql/data
    networks:
      - sigo_network

  redis:
    image: redis:7-alpine
    container_name: sigo-dental-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - sigo_redis:/data
    networks:
      - sigo_network

  api:
    profiles: ["full"]
    container_name: sigo-dental-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://sigo:sigo_dev@postgres:5432/sigo_dental?sslmode=disable
      PORT: "3000"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      CLINICAL_STORAGE_DIR: /app/var/clinical
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sigo_clinical_files:/app/var/clinical
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sigo_network

  frontend:
    profiles: ["full"]
    container_name: sigo-dental-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sigo_network

volumes:
  sigo_postgres:
  sigo_redis:
  sigo_clinical_files:

networks:
  sigo_network:
